[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Dependência opcional do `pg`: não existe no ambiente e quebraria o bundle.
  external_node_modules = ["pg-native"]

# A API do backend roda como Function; o front chama /api/... normalmente.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
